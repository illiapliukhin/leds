name: Mono split firmware

on:
  push:
    paths:
      - "firmware/mono_split/**"
      - ".github/workflows/mono_split_firmware.yml"
  pull_request:
    paths:
      - "firmware/mono_split/**"
      - ".github/workflows/mono_split_firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    defaults:
      run:
        working-directory: firmware/mono_split
    steps:
      - uses: actions/checkout@v4
      - name: Pin table check
        run: python3 tools/check_pins.py
      - name: Build
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target esp32s3
          idf.py build
